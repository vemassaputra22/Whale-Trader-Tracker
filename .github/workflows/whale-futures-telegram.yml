# Whale Futures Telegram Alerts — workflow BARU, terpisah dari workflow spot Solana lama.
# Pasang file ini di: .github/workflows/whale-futures-telegram.yml
# Script pendamping (wajib, satu repo): whale_futures_notifier.py
# Secrets yang dibutuhkan (Settings > Secrets and variables > Actions):
#   TELEGRAM_BOT_TOKEN  dan  TELEGRAM_CHAT_ID
# Variables opsional: MIN_SIZE_USD, LIQ_DANGER_PCT, PUMP_MIN_SIZE_USD, TOPUP_MIN_USD, ALERT_TOPUP (kalau kosong pakai default di bawah).
# PEMICU EKSTERNAL (biar alert tidak telat, permintaan user 2026-11-25):
#   Jadwal GitHub (cron di bawah) sering baru jalan ~1 jam sekali, bukan
#   tiap 5 menit. Supaya workflow jalan tepat tiap 5 menit, pemicu luar
#   (cron-job.org, gratis) mengirim repository_dispatch tiap 5 menit:
#     POST https://api.github.com/repos/vemassaputra22/Whale-Trader-Tracker/dispatches
#     Header: Authorization: Bearer <PAT GitHub>
#     Body: {"event_type": "whale-check"}
#   PAT dibuat di GitHub Settings > Developer settings > Personal access
#   tokens (fine-grained, hanya repo ini, Contents: Read and write +
#   Actions: Read and write). Token TIDAK disimpan di repo — hanya
#   ditempel di cron-job.org. Jadwal cron di bawah tetap ada sebagai
#   cadangan bila pemicu luar mati.
name: Whale Futures Telegram Alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [whale-check]
  workflow_dispatch:
    inputs:
      test:
        description: "Kirim pesan tes ke Telegram"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: whale-futures-telegram
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pulihkan state posisi terakhir
        uses: actions/cache@v4
        with:
          path: .whale-state
          key: whale-futures-state-${{ github.run_id }}
          restore-keys: |
            whale-futures-state-

      - name: Cek posisi whale futures & kirim notif Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_SIZE_USD: ${{ vars.MIN_SIZE_USD || '500000' }}
          LIQ_DANGER_PCT: ${{ vars.LIQ_DANGER_PCT || '12' }}
          ALERT_NEW_POSITION: "1"
          ALERT_TP_SL_HIT: "1"
          ALERT_LIQ_DANGER: "1"
          PUMP_PRIORITY: "1"
          PUMP_MIN_SIZE_USD: ${{ vars.PUMP_MIN_SIZE_USD || '100000' }}
          TOPUP_MIN_USD: ${{ vars.TOPUP_MIN_USD || '25000' }}
          ALERT_TOPUP: ${{ vars.ALERT_TOPUP || '1' }}
          TEST_MODE: ${{ inputs.test }}
        run: python whale_futures_notifier.py
