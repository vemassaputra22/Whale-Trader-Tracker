# Whale Futures Telegram Alerts — workflow BARU, terpisah dari workflow spot Solana lama.
# Pasang file ini di: .github/workflows/whale-futures-telegram.yml
# Script pendamping (wajib, satu repo): whale_futures_notifier.py
# Secrets yang dibutuhkan (Settings > Secrets and variables > Actions):
#   TELEGRAM_BOT_TOKEN  dan  TELEGRAM_CHAT_ID
# Variables opsional: MIN_SIZE_USD, LIQ_DANGER_PCT, PUMP_MIN_SIZE_USD (kalau kosong pakai default di bawah).
name: Whale Futures Telegram Alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Kirim pesan tes ke Telegram"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: whale-futures-telegram
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pulihkan state posisi terakhir
        uses: actions/cache@v4
        with:
          path: .whale-state
          key: whale-futures-state-${{ github.run_id }}
          restore-keys: |
            whale-futures-state-

      - name: Cek posisi whale futures & kirim notif Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_SIZE_USD: ${{ vars.MIN_SIZE_USD || '500000' }}
          LIQ_DANGER_PCT: ${{ vars.LIQ_DANGER_PCT || '12' }}
          ALERT_NEW_POSITION: "1"
          ALERT_TP_SL_HIT: "1"
          ALERT_LIQ_DANGER: "1"
          PUMP_PRIORITY: "1"
          PUMP_MIN_SIZE_USD: ${{ vars.PUMP_MIN_SIZE_USD || '100000' }}
          TEST_MODE: ${{ inputs.test }}
        run: python whale_futures_notifier.py
