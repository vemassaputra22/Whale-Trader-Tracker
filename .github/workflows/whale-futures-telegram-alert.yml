# =====================================================================
# Whale Futures Telegram Alert
# Pengganti telegram-test.yml (yang hanya mengirim pesan tes statis).
#
# CARA PASANG (dari tablet, di repo Whale-Trader-Tracker):
#   1. Upload file ini ke folder:  .github/workflows/
#      dengan nama:  whale-futures-telegram-alert.yml
#   2. Pastikan dua secret ini sudah ada di repo:
#      Settings > Secrets and variables > Actions
#        TELEGRAM_BOT_TOKEN   (token bot Telegram kamu)
#        TELEGRAM_CHAT_ID     (chat ID tujuan notif)
#      (Nama secret sama persis dengan workflow tes sebelumnya,
#       jadi kalau tes kemarin berhasil, tidak perlu buat ulang.)
#   3. Tes manual: tab Actions > "Whale Futures Telegram Alert" >
#      Run workflow. Run pertama mengirim 1 pesan "pemantauan dimulai",
#      bukan spam semua posisi lama.
#   4. Setelah itu workflow jalan otomatis tiap 5 menit
#      (jadwal GitHub bisa terlambat beberapa menit, itu normal).
#
# ALERT YANG DIKIRIM:
#   - Posisi futures BARU dari whale besar (default >= $250.000)
#   - Harga menyentuh TP / SL yang dipasang whale itu sendiri
#   - Posisi ditutup (dengan catatan kemungkinan TP/SL/manual)
#   - Harga dekat ke likuidasi (default <= 10% dari harga likuidasi)
#   Setiap pesan berisi: koin, LONG/SHORT, leverage, ukuran posisi,
#   entry, harga sekarang, PnL, TP, SL, dan harga likuidasi.
#
# CATATAN JUJUR SOAL DATA:
#   - Sumber posisi: Hyperliquid perpetual futures (publik, tanpa API
#     key). Binance/Bybit tidak dipakai karena API futures-nya
#     terblokir dari banyak lokasi.
#   - TP/SL hanya tampil kalau whale-nya memang memasang order TP/SL.
#     Kalau tidak, pesan menulis "Belum dipasang whale" - tidak
#     dikarang. Banyak whale besar memang tidak memasang TP/SL.
#   - Pengaturan opsional lewat Settings > Secrets and variables >
#     Actions > tab Variables:
#       WHALE_MIN_POSITION_USD  (default 250000)
#       WHALE_TOP_WHALES        (default 30 whale berposisi per run)
#       WHALE_NEAR_LIQ_PCT      (default 10)
# =====================================================================

name: Whale Futures Telegram Alert

on:
  workflow_dispatch:
    inputs:
      min_position_usd:
        description: "Ukuran posisi minimum untuk alert (USD, kosongkan = pakai default)"
        required: false
        default: ""
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

concurrency:
  group: whale-futures-telegram-alert
  cancel-in-progress: false

jobs:
  whale-futures-alert:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ambil state run sebelumnya (agar tidak spam alert ganda)
        uses: actions/cache@v4
        with:
          path: .whale-state
          key: whale-futures-state-${{ github.run_id }}
          restore-keys: |
            whale-futures-state-

      - name: Cek posisi futures whale dan kirim alert Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_POSITION_USD: ${{ inputs.min_position_usd || vars.WHALE_MIN_POSITION_USD || '250000' }}
          TOP_WHALES: ${{ vars.WHALE_TOP_WHALES || '30' }}
          NEAR_LIQ_PCT: ${{ vars.WHALE_NEAR_LIQ_PCT || '10' }}
          MAX_SCAN: "150"
          MAX_ALERTS_PER_RUN: "10"
          STATE_FILE: ".whale-state/seen_positions.json"
        run: |
          python3 - <<'PYEOF'
          #!/usr/bin/env python3
          """Whale Futures Telegram Alert - Hyperliquid perpetual futures.

          Reads open whale positions (not just transactions) from the public
          Hyperliquid API, derives TP / SL from each whale's own open trigger
          orders, and sends Telegram alerts for:
            1. New large positions
            2. Positions close to liquidation
            3. Price crossing a whale's TP or SL level
            4. Positions that were closed since the previous run

          Stdlib only. State between runs is kept in a small JSON file so the
          GitHub Actions cache can carry it from run to run.
          """
          import html
          import json
          import os
          import sys
          import urllib.request
          from datetime import datetime, timezone

          HL_INFO = "https://api.hyperliquid.xyz/info"
          HL_LEADERBOARD = "https://stats-data.hyperliquid.xyz/Mainnet/leaderboard"

          BOT_TOKEN = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          CHAT_ID = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          DRY_RUN = os.environ.get("DRY_RUN", "").lower() in ("1", "true", "yes")
          MIN_POSITION_USD = float(os.environ.get("MIN_POSITION_USD", "250000"))
          TOP_WHALES = int(os.environ.get("TOP_WHALES", "30"))
          NEAR_LIQ_PCT = float(os.environ.get("NEAR_LIQ_PCT", "10"))
          MAX_ALERTS = int(os.environ.get("MAX_ALERTS_PER_RUN", "10"))
          STATE_FILE = os.environ.get("STATE_FILE", ".whale-state/seen_positions.json")


          def http_json(url, payload=None, retries=3):
              import time

              data = None
              headers = {"Content-Type": "application/json"}
              if payload is not None:
                  data = json.dumps(payload).encode("utf-8")
              last_exc = None
              for attempt in range(retries):
                  try:
                      req = urllib.request.Request(url, data=data, headers=headers)
                      with urllib.request.urlopen(req, timeout=60) as resp:
                          return json.loads(resp.read().decode("utf-8"))
                  except Exception as exc:  # transient network slowness: retry
                      last_exc = exc
                      if attempt < retries - 1:
                          time.sleep(2 * (attempt + 1))
              raise last_exc


          def fnum(value, default=None):
              try:
                  if value is None or value == "":
                      return default
                  return float(value)
              except (TypeError, ValueError):
                  return default


          def fmt_usd(value):
              if value is None:
                  return "-"
              sign = "-" if value < 0 else ""
              return f"{sign}${abs(value):,.0f}"


          def fmt_px(value):
              if value is None:
                  return "-"
              if value >= 1000:
                  return f"${value:,.2f}"
              if value >= 1:
                  return f"${value:,.4f}".rstrip("0").rstrip(".")
              return f"${value:,.6f}".rstrip("0").rstrip(".")


          def fmt_pct(value):
              if value is None:
                  return "-"
              return f"{value:+.1f}%"


          def dist_pct(price, ref):
              if price is None or ref is None or ref == 0:
                  return None
              return abs(price - ref) / ref * 100.0


          def classify_tpsl(orders, coin, side, entry):
              """Return (tp, sl) from the whale's own open trigger orders.

              TP/SL orders on Hyperliquid are trigger + reduce-only orders.
              Long : TP sits above entry, SL below entry.
              Short: TP sits below entry, SL above entry.
              If the whale placed no such order, return None for that side -
              the alert then honestly says the whale has not set one.
              """
              triggers = []
              for order in orders or []:
                  if order.get("coin") != coin:
                      continue
                  if not order.get("isTrigger"):
                      continue
                  trigger_px = fnum(order.get("triggerPx"))
                  if trigger_px is None or entry is None:
                      continue
                  triggers.append(trigger_px)
              tp_candidates, sl_candidates = [], []
              for px in triggers:
                  if side == "LONG":
                      (tp_candidates if px > entry else sl_candidates).append(px)
                  else:
                      (tp_candidates if px < entry else sl_candidates).append(px)
              # Closest level to entry wins when a whale stacked several orders.
              tp = min(tp_candidates, key=lambda p: abs(p - entry)) if tp_candidates else None
              sl = min(sl_candidates, key=lambda p: abs(p - entry)) if sl_candidates else None
              return tp, sl


          def fetch_positions():
              marks = {}
              try:
                  meta, ctxs = http_json(HL_INFO, {"type": "metaAndAssetCtxs"})
                  for asset, ctx in zip(meta.get("universe", []), ctxs):
                      mark = fnum(ctx.get("markPx"))
                      if mark is not None:
                          marks[asset.get("name")] = mark
              except Exception as exc:  # mark prices are an enhancement, not fatal
                  print(f"Warning: could not fetch mark prices: {exc}", file=sys.stderr)

              board = http_json(HL_LEADERBOARD)
              rows = board.get("leaderboardRows", [])
              # NOTE: do NOT re-sort by accountValue. The leaderboard payload also
              # contains rows whose accountValue is inflated while the account is
              # actually empty (verified live 2026-11-18: the top accountValue row
              # held ~$8k margin and zero positions). The returned order ranks real
              # trading accounts first, so scan in order and keep only accounts
              # that genuinely hold open positions.
              max_scan = int(os.environ.get("MAX_SCAN", "150"))

              positions = {}
              whales_with_positions = 0
              for row in rows[:max_scan]:
                  if whales_with_positions >= TOP_WHALES:
                      break
                  address = row.get("ethAddress")
                  if not address:
                      continue
                  try:
                      state = http_json(
                          HL_INFO, {"type": "clearinghouseState", "user": address}
                      )
                  except Exception as exc:
                      print(f"Warning: skip {address}: {exc}", file=sys.stderr)
                      continue
                  if not state.get("assetPositions"):
                      continue
                  whales_with_positions += 1
                  try:
                      orders = http_json(
                          HL_INFO, {"type": "frontendOpenOrders", "user": address}
                      )
                  except Exception:
                      orders = []
                  for item in state.get("assetPositions", []):
                      pos = item.get("position", {})
                      coin = pos.get("coin")
                      szi = fnum(pos.get("szi"), 0) or 0
                      if not coin or szi == 0:
                          continue
                      size_usd = fnum(pos.get("positionValue"), 0) or 0
                      entry = fnum(pos.get("entryPx"))
                      side = "LONG" if szi > 0 else "SHORT"
                      tp, sl = classify_tpsl(orders, coin, side, entry)
                      leverage = (pos.get("leverage") or {}).get("value")
                      key = f"{address.lower()}:{coin}"
                      positions[key] = {
                          "address": address,
                          "coin": coin,
                          "side": side,
                          "size_coin": abs(szi),
                          "size_usd": size_usd,
                          "entry": entry,
                          "mark": marks.get(coin),
                          "leverage": leverage,
                          "pnl": fnum(pos.get("unrealizedPnl"), 0) or 0,
                          "liq": fnum(pos.get("liquidationPx")),
                          "tp": tp,
                          "sl": sl,
                      }
              return positions


          def level_line(label, price, mark):
              if price is None:
                  return f"{label}: Belum dipasang whale"
              return f"{label}: {fmt_px(price)} ({fmt_pct(dist_pct(price, mark))} dari harga sekarang)"


          def position_block(pos):
              short_addr = pos["address"][:6] + "..." + pos["address"][-4:]
              arrow = "🟢 LONG" if pos["side"] == "LONG" else "🔴 SHORT"
              lev = f"{pos['leverage']}x" if pos.get("leverage") else "-"
              lines = [
                  f"<b>{html.escape(pos['coin'])}-PERP {arrow} {lev}</b> — Hyperliquid Futures",
                  f"Whale: <code>{html.escape(short_addr)}</code>",
                  f"Ukuran: {fmt_usd(pos['size_usd'])} ({pos['size_coin']:,.4f} {html.escape(pos['coin'])})",
                  f"Entry: {fmt_px(pos['entry'])} | Harga sekarang: {fmt_px(pos['mark'])}",
                  f"PnL: {fmt_usd(pos['pnl'])}",
                  level_line("🎯 TP", pos.get("tp"), pos.get("mark")),
                  level_line("🛑 SL", pos.get("sl"), pos.get("mark")),
              ]
              if pos.get("liq") is None:
                  lines.append("💥 Likuidasi: sangat jauh / tidak diberikan API")
              else:
                  lines.append(
                      f"💥 Likuidasi: {fmt_px(pos['liq'])} "
                      f"({fmt_pct(dist_pct(pos['liq'], pos['mark']))} dari harga sekarang)"
                  )
              return "\n".join(lines)


          def crossed(pos, level_key, prev_pos):
              """True when current mark has crossed the TP/SL stored last run."""
              level = (prev_pos or pos).get(level_key)
              mark = pos.get("mark")
              if level is None or mark is None:
                  return False
              if level_key == "tp":
                  return mark >= level if pos["side"] == "LONG" else mark <= level
              return mark <= level if pos["side"] == "LONG" else mark >= level


          def build_alerts(current, previous, first_run):
              alerts = []  # (priority, text) - lower priority number sends first
              now_wib = datetime.now(timezone.utc).strftime("%d %b %Y %H:%M UTC")
              if first_run:
                  big = [p for p in current.values() if p["size_usd"] >= MIN_POSITION_USD]
                  text = (
                      "🐋 <b>Whale Futures Alert aktif</b>\n"
                      f"Pemantauan dimulai ({now_wib}).\n"
                      f"Sedang dipantau: {len(current)} posisi futures terbuka, "
                      f"{len(big)} di antaranya &gt;= {fmt_usd(MIN_POSITION_USD)}.\n"
                      "Alert berikutnya dikirim saat ada posisi besar baru, harga "
                      "menyentuh TP/SL whale, posisi ditutup, atau likuidasi mendekat."
                  )
                  return [(0, text)]

              for key, pos in current.items():
                  prev = previous.get(key)
                  flags = (prev or {}).get("flags", {}) if prev else {}
                  pos.setdefault("flags", {})
                  # TP / SL touched
                  for level_key, label, prio in (("tp", "🎯 TP KENA", 1), ("sl", "🛑 SL KENA", 1)):
                      flag = level_key + "_alerted"
                      if crossed(pos, level_key, prev):
                          if not flags.get(flag):
                              alerts.append((prio, f"<b>{label}</b>\n" + position_block(pos)))
                          pos["flags"][flag] = True
                      else:
                          pos["flags"][flag] = False
                  # Near liquidation
                  liq_dist = dist_pct(pos.get("liq"), pos.get("mark"))
                  near = liq_dist is not None and liq_dist <= NEAR_LIQ_PCT
                  if near and pos["size_usd"] >= MIN_POSITION_USD:
                      if not flags.get("liq_alerted"):
                          alerts.append((0, "<b>⚠️ LIKUIDASI MENDEKAT</b>\n" + position_block(pos)))
                      pos["flags"]["liq_alerted"] = True
                  else:
                      pos["flags"]["liq_alerted"] = False
                  # New large position
                  if prev is None and pos["size_usd"] >= MIN_POSITION_USD:
                      alerts.append((2, "<b>🐋 POSISI FUTURES BARU</b>\n" + position_block(pos)))

              # Closed positions
              for key, prev in previous.items():
                  if key in current or prev.get("size_usd", 0) < MIN_POSITION_USD:
                      continue
                  note = "Posisi ini sudah tidak terbuka lagi di Hyperliquid."
                  tp, sl, mark = prev.get("tp"), prev.get("sl"), prev.get("mark")
                  if tp is not None and mark is not None:
                      if (prev["side"] == "LONG" and mark >= tp) or (
                          prev["side"] == "SHORT" and mark <= tp
                      ):
                          note = "Harga terakhir berada di/di luar level TP whale — kemungkinan ditutup karena TP, tapi bisa juga ditutup manual."
                  if sl is not None and mark is not None:
                      if (prev["side"] == "LONG" and mark <= sl) or (
                          prev["side"] == "SHORT" and mark >= sl
                      ):
                          note = "Harga terakhir berada di/di luar level SL whale — kemungkinan ditutup karena SL, tapi bisa juga ditutup manual."
                  alerts.append(
                      (3, "<b>✅ POSISI DITUTUP</b>\n" + position_block(prev) + f"\n{note}")
                  )

              alerts.sort(key=lambda item: item[0])
              return alerts


          def send_telegram(text):
              if DRY_RUN:
                  print("----- DRY RUN MESSAGE -----")
                  print(text)
                  print("---------------------------")
                  return
              if not BOT_TOKEN or not CHAT_ID:
                  raise SystemExit(
                      "Secrets belum lengkap: set TELEGRAM_BOT_TOKEN dan "
                      "TELEGRAM_CHAT_ID di repo Settings > Secrets and variables > "
                      "Actions, lalu jalankan lagi."
                  )
              payload = {
                  "chat_id": CHAT_ID,
                  "text": text,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": "true",
              }
              data = "&".join(
                  f"{k}={urllib.request.quote(str(v), safe='')}" for k, v in payload.items()
              ).encode("utf-8")
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage", data=data
              )
              with urllib.request.urlopen(req, timeout=30) as resp:
                  result = json.loads(resp.read().decode("utf-8"))
              if not result.get("ok"):
                  raise SystemExit(f"Telegram menolak pesan: {result}")


          def load_state():
              try:
                  with open(STATE_FILE, "r", encoding="utf-8") as fh:
                      data = json.load(fh)
                  return data.get("positions", {}), False
              except (FileNotFoundError, json.JSONDecodeError):
                  return {}, True


          def save_state(positions):
              os.makedirs(os.path.dirname(STATE_FILE) or ".", exist_ok=True)
              with open(STATE_FILE, "w", encoding="utf-8") as fh:
                  json.dump({"positions": positions}, fh)


          def main():
              previous, first_run = load_state()
              current = fetch_positions()
              print(f"Posisi futures terbuka ditemukan: {len(current)}")
              alerts = build_alerts(current, previous, first_run)
              sent = 0
              for _prio, text in alerts:
                  if sent >= MAX_ALERTS:
                      send_telegram(
                          f"ℹ️ Masih ada {len(alerts) - sent} alert lain pada run ini "
                          "yang tidak dikirim agar tidak spam. Naikkan "
                          "MAX_ALERTS_PER_RUN bila perlu."
                      )
                      break
                  send_telegram(text)
                  sent += 1
              print(f"Alert terkirim: {sent} dari {len(alerts)}")
              save_state(current)


          if __name__ == "__main__":
              main()
          PYEOF
